name: CI
on:
  push:
    tags: '*'
    branches-ignore:
      - 'autodelivery**'
      - 'bump-**'
      - 'renovate/**'
    paths-ignore:
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'README.md'
      - 'renovate.json'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, compilation, unit tests, loading of every simulation file and short golden-master runs of the
  # simulations (the full experiments take hours: run them locally with ./gradlew runAll).
  Simulations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up the JDK
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
      - name: Cache the PyTorch native libraries
        uses: actions/cache@v6.1.0
        with:
          path: ~/.djl.ai
          key: djl-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Check and test
        run: ./gradlew spotlessCheck test
      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-reports
          path: build/reports/tests
  # Tests of the analysis pipeline that produces the paper figures and tables.
  Analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: '.python-version'
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Test the analysis
        run: python -m pytest
  UpdateDoc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - name: Update readme
        run: npx embedme README.md
      - uses: stefanzweifel/git-auto-commit-action@v7.2.1
        with:
          commit_message: "docs: autoupdate readme from scripts changes"
  ci-success:
    runs-on: ubuntu-latest
    needs:
      - Simulations
      - Analysis
      - UpdateDoc
    if: >-
      always() && (
        contains(join(needs.*.result, ','), 'failure')
        || !contains(join(needs.*.result, ','), 'cancelled')
      )
    steps:
      - name: Verify that there were no failures
        run: ${{ !contains(join(needs.*.result, ','), 'failure') }}
