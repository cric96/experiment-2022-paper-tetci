# Formatting of the Scala 3 sources, applied by `./gradlew spotlessApply` and checked by `./gradlew spotlessCheck`.
# Style: Scala 3 syntax with significant indentation; end markers close the long definitions (see CLAUDE.md).

version = 3.11.5
runner.dialect = scala3

maxColumn = 120
align.preset = none
assumeStandardLibraryStripMargin = true

rewrite {
  rules = [RedundantBraces, RedundantParens, SortModifiers, Imports]
  redundantBraces.stringInterpolation = true
  imports.sort = original
  scala3 {
    convertToNewSyntax = true
    removeOptionalBraces = yes
    insertEndMarkerMinLines = 25
    removeEndMarkerMaxLines = 15
  }
}

newlines {
  sometimesBeforeColonInMethodReturnType = false
  alwaysBeforeElseAfterCurlyIf = false
}

binPack {
  literalArgumentLists = true
  literalsIncludeSimpleExpr = true
  literalsExclude = ["Term.Name"]
}

docstrings {
  style = SpaceAsterisk
  oneline = fold
}

includeNoParensInSelectChains = false
